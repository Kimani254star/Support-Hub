<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — Acacia Books</title>
<link href="shared.css" rel="stylesheet">
</head><body data-page="dashboard">
<main class="main">
  <div class="topbar"><div><h1>Dashboard</h1><p>Overview of every Acacia Books app</p></div></div>
  <div class="content">
    <div class="stats">
      <div class="card stat"><h3>Connected Apps</h3><div class="val" id="cApps">0</div></div>
      <div class="card stat"><h3>Active Users</h3><div class="val" id="cUsers">0</div></div>
      <div class="card stat"><h3>Open Tickets</h3><div class="val" id="cTickets">0</div></div>
      <div class="card stat"><h3>Revenue (paid)</h3><div class="val" id="cRev">$0</div></div>
    </div>
    <div class="card">
      <h3 style="color:#062b69;font-weight:800;margin-bottom:12px;">Apps overview</h3>
      <div id="appsGrid" class="grid-3"></div>
    </div>
  </div>
</main>
<script src="shared.js"></script>
<script>
  const apps=acaciaStore.get('acacia_apps',[]);
  const users=acaciaStore.get('acacia_users',[]);
  const tickets=acaciaStore.get('acacia_tickets',[]);
  const invoices=acaciaStore.get('acacia_invoices',[]);
  document.getElementById('cApps').textContent=apps.length;
  document.getElementById('cUsers').textContent=users.filter(u=>u.status==='active').length;
  document.getElementById('cTickets').textContent=tickets.filter(t=>t.status==='open').length;
  document.getElementById('cRev').textContent='$'+invoices.filter(i=>i.status==='paid').reduce((s,i)=>s+Number(i.amount||0),0).toLocaleString();
  const grid=document.getElementById('appsGrid');
  if(!apps.length){
    grid.outerHTML='<div class="empty"><div class="icon">📦</div><h3>No apps yet</h3><p>Add your first website in the Apps Hub.</p></div>';
  } else {
    grid.innerHTML=apps.map(a=>`
      <div class="card" style="display:flex;gap:12px;align-items:flex-start;">
        <div style="width:44px;height:44px;border-radius:10px;background:${a.color||'#062b69'};color:#fff;display:grid;place-items:center;font-weight:800;">${(a.name||'?')[0]}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;color:#062b69;">${a.name}</div>
          <div style="font-size:12px;color:#6b7280;">App ID · ${a.id}</div>
          <div style="font-size:13px;color:#6b7280;margin-top:6px;">${a.description||''}</div>
        </div>
      </div>`).join('');
  }
</script>
</body></html>
